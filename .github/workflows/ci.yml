name: gates

# This repository ships verification gates; CI runs them against the repository
# itself. The local redaction denylist (step 3 of the pre-publish checklist) is
# git-ignored by design and cannot run here — it stays a pre-push step.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Formatting (sanitization/check-format.py)
        run: python3 sanitization/check-format.py .

      - name: Index integrity (sanitization/check-index.py)
        run: python3 sanitization/check-index.py .

      - name: Every learnings file is indexed
        run: |
          missing=0
          for f in agent-knowledge/references/learnings-*.md; do
            grep -q "]($(basename "$f"))" agent-knowledge/references/index.md \
              || { echo "::error file=$f::not referenced in index.md"; missing=1; }
          done
          exit $missing

      - name: Learnings entry numbering is unique
        run: |
          rc=0
          for f in agent-knowledge/references/learnings-*.md; do
            dup=$(grep -oE '^[0-9]+\.' "$f" | sort | uniq -d | tr '\n' ' ')
            [ -n "$dup" ] && { echo "::error file=$f::duplicate entry numbers: $dup"; rc=1; }
          done
          exit $rc

      # Dispatch on the SHEBANG, not the extension. Two gates are Python that
      # keep a .sh name on purpose: the name is referenced by hooks and dispatch
      # prompts by absolute path, and renaming them would silently break every
      # caller, whereas the shebang is what the kernel actually honours.
      - name: Shell syntax
        run: |
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*(ba)?sh' || continue
            bash -n "$f" || rc=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $rc

      - name: ShellCheck (error level)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*(ba)?sh' || continue
            shellcheck -S error "$f" || rc=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $rc

      # compileall only walks *.py, so the two gates that are Python under a .sh
      # name would be checked by NEITHER this nor the shell gate above. Dispatch
      # on the shebang here too, or skipping them in one gate silently drops them
      # from both and the suite reads green on an unchecked file.
      - name: Python syntax
        run: |
          python3 -m compileall -q core sanitization tools agent-knowledge
          rc=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*python' || continue
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" || rc=1
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $rc

      - name: Secret scan (gitleaks)
        run: |
          curl -sSL -o /tmp/gl.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --redact --source . --exit-code 1
